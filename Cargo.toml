[package]
name = "org-studio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "2"
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform", features = ["font-kit"] }
image = "0.25.10"
notify = "8"
profiling = { version = "1", features = ["profile-with-tracing"] }
pulldown-cmark = "0.13"
ropey = "1.6.1"
tracing = "0.1"
tree-sitter-highlight = "0.26.7"
tree-sitter-sequel = "0.3.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.2"
unicode-segmentation = "1.13"
smallvec = "1.15"
url = "2"
cosmic-text = { version = "0.19", features = ["monospace_fallback", "shape-run-cache"] }

[dev-dependencies]
gpui = { path = "../zed/crates/gpui", features = ["test-support"] }

[build-dependencies]
# gpui_apple compiles gpui as a macOS build dependency. Keep the profiling
# backend identical in Cargo's host and target dependency graphs so GPUI's
# profiling attributes resolve to the same tracing implementation.
profiling = { version = "1", features = ["profile-with-tracing"] }
