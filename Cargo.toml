[package]
name = "org-studio"
version = "0.1.0"
edition = "2024"
publish = false

[features]
benchmarks = []

[dependencies]
async-channel = "2"
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform", features = ["font-kit"] }
image = "0.25.10"
jiff = { version = "0.2", default-features = false, features = ["std"] }
notify = "8"
profiling = { version = "1", features = ["profile-with-tracing"] }
pulldown-cmark = "0.13"
ropey = "1.6.1"
roxmltree = "0.21"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
typst = "=0.15.0"
typst-kit = { version = "=0.15.0", default-features = false, features = ["scan-fonts"] }
typst-layout = "=0.15.0"
typst-pdf = "=0.15.0"
typst-render = "=0.15.0"
typst-svg = "=0.15.0"
typstuml = { path = "../TypstUML", default-features = false, features = ["embed-typst"] }
tree-sitter-highlight = "0.26.7"
tree-sitter-sequel = "0.3.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
trash = { git = "https://github.com/zed-industries/trash-rs", rev = "41c6c800d884a89351f3b8856d12894cccee261d" }
unicode-width = "0.2"
unicode-segmentation = "1.13"
smallvec = "1.15"
url = "2"
cosmic-text = { version = "0.19", features = ["monospace_fallback", "shape-run-cache"] }
fontdb = "0.23"
sys-locale = "0.3.2"

[dev-dependencies]
gpui = { path = "../zed/crates/gpui", features = ["test-support"] }
syn = { version = "2", features = ["full", "visit"] }

[build-dependencies]
# gpui_apple compiles gpui as a macOS build dependency. Keep the profiling
# backend identical in Cargo's host and target dependency graphs so GPUI's
# profiling attributes resolve to the same tracing implementation.
profiling = { version = "1", features = ["profile-with-tracing"] }
